name: Validate pstack Pi candidate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  validate:
    name: pstack Pi candidate validation
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'pi-candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the committed candidate head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the committed Pi package without writing
        run: node scripts/pstack-pi/check.mjs

      - name: Run the deterministic Pi test entry
        run: node scripts/pstack-pi/test.mjs

  report:
    name: pstack Pi candidate report
    needs: validate
    if: always() && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'pi-candidate'
    concurrency:
      group: pstack-pi-report-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint the pstack report App token
        id: report-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PSTACK_PI_APP_ID }}
          private-key: ${{ secrets.PSTACK_PI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Check out the trusted base revision only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Update the single report comment after the head check
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: >-
          node scripts/pstack-pi/report.mjs
          --repo "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head "$EXPECTED_HEAD"
          --outcome "$VALIDATION_RESULT"
          --run-id "$RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --run-url "$RUN_URL"
